name: link-build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Protocol matches the 3DS app
        run: |
          curl -fsSL https://raw.githubusercontent.com/AlienGurke/3DS-Link/master/include/LinkProto.h -o "$RUNNER_TEMP/LinkProto.h"
          diff -u --strip-trailing-cr "$RUNNER_TEMP/LinkProto.h" src/citra_qt/link/LinkProto.h
      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-msvc-${{ github.sha }}
          restore-keys: ccache-msvc-
      - name: Set up MSVC
        uses: azahar-emu/msvc-dev-cmd@v1
      - name: Install tools
        run: choco install -y --no-progress ccache ninja
      - name: Cache OpenH264
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-openh264-x64-windows-static-md-v1
      - name: OpenH264 (bottom screen as H.264)
        run: |
          export VCPKG_DEFAULT_BINARY_CACHE="$(cygpath -w "$GITHUB_WORKSPACE/.vcpkg-cache")"
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-cache"
          VCPKG="$(cygpath -u "$VCPKG_INSTALLATION_ROOT")"
          "$VCPKG/vcpkg.exe" install openh264:x64-windows-static-md
          echo "OPENH264_PREFIX=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/installed/x64-windows-static-md" >> "$GITHUB_ENV"
      - name: Disable line ending translation
        run: git config --global core.autocrlf input
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_FFMPEG=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_ROOM_STANDALONE=OFF \
            -DENABLE_LTO=OFF \
            -DCITRA_WARNINGS_AS_ERRORS=OFF \
            -DCMAKE_PREFIX_PATH="$OPENH264_PREFIX"
          ninja
          ninja bundle
          ccache -s
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: azahar-link-windows
          path: build/bundle/
